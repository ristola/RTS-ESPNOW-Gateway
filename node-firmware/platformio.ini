; PlatformIO Project Configuration File
;
; RTS ESP-NOW Gateway - minimal reference/test node firmware
; Board: M5Stack AtomS3 Lite (ESP32-S3), used purely to test the gateway's
; provisioning handshake and settings push end-to-end - see
; ../TASKS.md and ../PROTOCOL.md's "Status" section. Not a real project's
; production node; a starting point for one.
;
; Board GPIOs (RGB LED 35, button 41) match the gateway's own AtomS3U
; board comment in ../gateway-firmware/platformio.ini - both are members
; of the espressif32 platform's "m5stack-atoms3" family.

[env:m5stack-atoms3-lite-test-node]
platform = espressif32
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200

build_flags =
    -Wall
    '-D BOARD_NAME="${this.board}"'
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; A distinct USB product string for this board was attempted and
    ; abandoned - see ../gateway-firmware/platformio.ini's matching comment
    ; for why (this board's ARDUINO_USB_MODE=1 routes through a
    ; fixed-descriptor hardware peripheral, not the customizable one).

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

; Shared RTSNow library (rtsnow_protocol.h wire format) - canonical source
; lives in ../libraries/RTSNow, also consumed by gateway-firmware and any
; other RTS project's node firmware.
lib_extra_dirs =
    ../libraries
