; PlatformIO Project Configuration File
;
; RTS ESP-NOW Gateway - M5Stack AtomS3U
; Board: ESP32-S3, USB-A dongle form factor, onboard single WS2812 RGB LED
;        (GPIO35), physical button (GPIO41), Grove port (unused here),
;        native USB-A connector doubling as the flashing/Serial (control
;        interface) port.
;
; No distinct "m5stack-atoms3u" board exists in PlatformIO's espressif32
; boards list (checked via `pio boards`) - only "m5stack-atoms3" (the
; full/Lite AtomS3 family). Confirmed against M5Stack's own AtomS3U docs
; that the RGB LED (GPIO35) and button (GPIO41) pins are identical, so
; that board definition's pin mapping is correct here too; the only real
; differences are this board's single LED (vs. the Lite's 4-chained one -
; see main.cpp's kLedCount) and its larger 16MB flash (this board
; definition's 8MB default partition table is just safely undersized,
; leaves flash unused, no functional impact).
;
; This gateway never joins Wi-Fi itself (see main.cpp) - it only tunes its
; radio to one fixed ESP-NOW channel of its own choosing (the `channel`
; serial command), so it never gets an IP address and can't do network
; OTA. Reflash over USB.

[env:m5stack-atoms3u]
platform = espressif32
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200

build_flags =
    -Wall
    '-D BOARD_NAME="${this.board}"'
    ; The board def sets ARDUINO_USB_MODE=1 (native USB) but not this - without
    ; it, Serial silently doesn't attach to the USB-C CDC port at boot.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Tried giving this board a distinct USB product string (so it's
    ; identifiable in `pio device list`/the port picker, instead of the
    ; generic "USB JTAG/serial debug unit" shared with node-firmware) via
    ; USB_PRODUCT/USB_MANUFACTURER build-time macros - doesn't work on this
    ; board: `m5stack-atoms3`'s own board manifest bakes in
    ; ARDUINO_USB_MODE=1, which routes USB through the ESP32-S3's
    ; fixed-function "USB Serial/JTAG" peripheral (a simple hardware
    ; debug/programming interface with a descriptor hardcoded in ROM/IDF,
    ; no application-level override exists for it) rather than the
    ; software TinyUSB CDC stack those macros actually configure. Fixing
    ; this for real would mean switching to ARDUINO_USB_MODE=0 (full
    ; native USB-OTG/TinyUSB), a real change to already-hard-won-stable
    ; flashing/reset behavior - not attempted. Distinguishing the gateway
    ; from a node is instead handled at the protocol level: desktop-app
    ; verifies it's actually talking to a gateway after connecting (see
    ; SERIAL_PROTOCOL.md) rather than trusting the OS-reported port name.

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2

; Shared RTSNow library (rtsnow_protocol.h wire format) - canonical source
; lives in ../libraries/RTSNow, also consumed by node-firmware and any
; other RTS project's node firmware (see that library's README comment).
lib_extra_dirs =
    ../libraries

; Network-reachable gateway variant: M5Stack AtomS3 + Atomic PoE Base
; (W5500 Ethernet-over-SPI), for the desktop app's "Set As Default
; Gateway" / network-first-then-USB-fallback connect flow (see
; src/gateway/network_client.py and settings.py) - a real alternative to
; the USB-only env:m5stack-atoms3u above, not a replacement for it: this
; board gives up the RTS-NOW *node* role entirely (ESP-NOW allows only one
; receive callback per chip, and this one is the gateway's own). Flashed
; onto RTSNow-SPI-CCP's own AtomS3+PoE Base unit - that project's
; node_atoms3_poe firmware (main_atom_node.cpp) is what used to run there
; ("Ethernet-Gateway" was just a *display* label on an RTS-NOW node, not
; this real protocol-level gateway); flashing this env converts it into
; the genuine article, and it stops heartbeating/appearing in known_devices
; as a node from that point on. Reflash over USB, same as the other
; environment - Ethernet here is for the desktop-app protocol only, not a
; firmware-update path.
;
; upload_speed/upload_flags match RTSNow-SPI-CCP's own node_atoms3_poe env
; for this exact same physical board pairing (plain AtomS3, not the
; AtomS3U dongle m5stack-atoms3u above targets) - that project's own
; comment notes real native-USB-CDC flashing quirks on this board/module
; combination that --no-stub works around.
[env:m5stack-atoms3_poe_gateway]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
build_flags =
    -Wall
    '-D BOARD_NAME="AtomS3POEGateway"'
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_GATEWAY_ATOMS3_POE
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2
; Local override of m5stack/M5-Ethernet@^4.0.0, not the registry copy -
; ported from RTSNow-SPI-CCP's own lib_ethernet/M5-Ethernet (same
; HOST_NAME "WIZnet" -> "RTSNow" patch to Dhcp.h). Copy rather than a
; cross-repo lib_extra_dirs reference: that sibling project's copy could
; move/change independently, and this one has no other dependency on
; that repo at all.
lib_extra_dirs =
    ../libraries
    lib_ethernet

; One-time bootstrap path only - NOT a real capability of gateway-firmware
; itself (it never runs ArduinoOTA in its own code, see this env's own
; header comment: reflash over USB same as m5stack-atoms3u). This exploits
; OTA being fundamentally firmware-agnostic: it just writes whatever bytes
; it receives via Update.write()/Update.end() and reboots, so whatever is
; CURRENTLY running on the target (here, RTSNow-SPI-CCP's own node
; firmware, mid-conversion, which still has its own ArduinoOTA listener
; active) can deliver this completely different program just as well as a
; same-project update. auth password matches that current firmware's own
; OTA_PASSWORD (RTSNow-SPI-CCP/include/secrets.h) - not this project's,
; since it's that firmware's listener actually answering the handshake.
[env:m5stack-atoms3_poe_gateway_ota]
extends = env:m5stack-atoms3_poe_gateway
upload_protocol = espota
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
