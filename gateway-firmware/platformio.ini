; PlatformIO Project Configuration File
;
; RTS ESP-NOW Gateway - M5Stack AtomS3U
; Board: ESP32-S3, USB-A dongle form factor, onboard single WS2812 RGB LED
;        (GPIO35), physical button (GPIO41), Grove port (unused here),
;        native USB-A connector doubling as the flashing/Serial (control
;        interface) port.
;
; No distinct "m5stack-atoms3u" board exists in PlatformIO's espressif32
; boards list (checked via `pio boards`) - only "m5stack-atoms3" (the
; full/Lite AtomS3 family). Confirmed against M5Stack's own AtomS3U docs
; that the RGB LED (GPIO35) and button (GPIO41) pins are identical, so
; that board definition's pin mapping is correct here too; the only real
; differences are this board's single LED (vs. the Lite's 4-chained one -
; see main.cpp's kLedCount) and its larger 16MB flash (this board
; definition's 8MB default partition table is just safely undersized,
; leaves flash unused, no functional impact).
;
; This gateway never joins Wi-Fi itself (see main.cpp) - it only tunes its
; radio to one fixed ESP-NOW channel of its own choosing (the `channel`
; serial command), so it never gets an IP address and can't do network
; OTA. Reflash over USB.

[env:m5stack-atoms3u]
platform = espressif32
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200

build_flags =
    -Wall
    '-D BOARD_NAME="${this.board}"'
    ; The board def sets ARDUINO_USB_MODE=1 (native USB) but not this - without
    ; it, Serial silently doesn't attach to the USB-C CDC port at boot.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Tried giving this board a distinct USB product string (so it's
    ; identifiable in `pio device list`/the port picker, instead of the
    ; generic "USB JTAG/serial debug unit" shared with node-firmware) via
    ; USB_PRODUCT/USB_MANUFACTURER build-time macros - doesn't work on this
    ; board: `m5stack-atoms3`'s own board manifest bakes in
    ; ARDUINO_USB_MODE=1, which routes USB through the ESP32-S3's
    ; fixed-function "USB Serial/JTAG" peripheral (a simple hardware
    ; debug/programming interface with a descriptor hardcoded in ROM/IDF,
    ; no application-level override exists for it) rather than the
    ; software TinyUSB CDC stack those macros actually configure. Fixing
    ; this for real would mean switching to ARDUINO_USB_MODE=0 (full
    ; native USB-OTG/TinyUSB), a real change to already-hard-won-stable
    ; flashing/reset behavior - not attempted. Distinguishing the gateway
    ; from a node is instead handled at the protocol level: desktop-app
    ; verifies it's actually talking to a gateway after connecting (see
    ; SERIAL_PROTOCOL.md) rather than trusting the OS-reported port name.

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2

; Shared RTSNow library (rtsnow_protocol.h wire format) - canonical source
; lives in ../libraries/RTSNow, also consumed by node-firmware and any
; other RTS project's node firmware (see that library's README comment).
lib_extra_dirs =
    ../libraries
